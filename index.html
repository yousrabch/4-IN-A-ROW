<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>4 IN A ROW GAME</title>
  </head>
  <body>
    <div class="container">
        <div class="balls"></div>
      <img src="./imgs/board.png" alt="board" class="board" />
      <div class="colums">
        <div class="colum" data-column="0"></div>
        <div class="colum" data-column="1"></div>
        <div class="colum" data-column="2"></div>
        <div class="colum" data-column="3"></div>
        <div class="colum" data-column="4"></div>
        <div class="colum" data-column="5"></div>
        <div class="colum" data-column="6"></div>
      </div>
      <div class="game-over">
        <div class="line"></div>
      </div>
      <div class="bottom">
        <div class="state">
          <!--<div class="red"></div> -->
          <div class="score">0 - 0</div>
          <!--<div class="blue"></div> -->
        </div>
        <div class="btns">
          <button class="button-24" role="button">RESET SCORE</button>
          <button class="button-85" role="button">PLAY AGAIN</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
